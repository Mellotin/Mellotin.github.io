<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE8E1"/>
      <stop offset="100%" stop-color="#D9D2C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bgMaster)"/>
  <circle cx="300" cy="240" r="160" fill="#FAF8F5" opacity="0.8"/>
  <!-- Портретный силуэт мастера-технолога в фартуке -->
  <g transform="translate(150, 100)">
    <!-- Голова и шея -->
    <circle cx="150" cy="110" r="70" fill="#C49A7E"/>
    <!-- Волосы и прическа -->
    <path d="M 80 100 C 80 40 220 40 220 100 C 220 60 170 50 150 50 C 120 50 85 65 80 100 Z" fill="#282420"/>
    <!-- Очки мастера -->
    <rect x="105" y="100" width="35" height="24" rx="4" fill="none" stroke="#1C1917" stroke-width="4"/>
    <rect x="160" y="100" width="35" height="24" rx="4" fill="none" stroke="#1C1917" stroke-width="4"/>
    <line x1="140" y1="110" x2="160" y2="110" stroke="#1C1917" stroke-width="4"/>
    <!-- Плечи и рубашка -->
    <path d="M 50 250 L 80 200 L 220 200 L 250 250 L 270 450 L 30 450 Z" fill="#FAF8F5"/>
    <!-- Ремесленный фартук из плотной кожи (терракота) -->
    <path d="M 90 230 L 210 230 L 230 460 L 70 460 Z" fill="#C2703E"/>
    <!-- Лямки фартука -->
    <line x1="110" y1="200" x2="110" y2="230" stroke="#4A7C59" stroke-width="12"/>
    <line x1="190" y1="200" x2="190" y2="230" stroke="#4A7C59" stroke-width="12"/>
    <!-- Нагрудный карман с инструментами (сантиметр, линейка) -->
    <rect x="110" y="260" width="80" height="70" rx="6" fill="#A85E34"/>
    <line x1="125" y1="240" x2="125" y2="270" stroke="#FAF8F5" stroke-width="6"/>
    <line x1="145" y1="230" x2="145" y2="270" stroke="#1C1917" stroke-width="4"/>
    <line x1="165" y1="235" x2="165" y2="270" stroke="#FAF8F5" stroke-width="6"/>
  </g>
</svg>