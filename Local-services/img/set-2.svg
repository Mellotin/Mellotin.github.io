<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <rect width="600" height="375" fill="#F4EAE1"/>
  <!-- Идеальный гардероб: ателье, подгонка, сантиметр, пуговицы -->
  <g transform="translate(170, 50)">
    <!-- Манекен -->
    <ellipse cx="130" cy="50" rx="30" ry="15" fill="#A85E34"/>
    <path d="M 90 70 C 80 120 70 170 85 230 L 175 230 C 190 170 180 120 170 70 Z" fill="#C2703E"/>
    <!-- Подставка -->
    <line x1="130" y1="230" x2="130" y2="290" stroke="#1C1917" stroke-width="8"/>
    <ellipse cx="130" cy="290" rx="50" ry="12" fill="#1C1917"/>
    <!-- Сантиметровая лента -->
    <path d="M 60 120 Q 130 160 200 120" fill="none" stroke="#FAF8F5" stroke-dasharray="8 4" stroke-width="6"/>
  </g>
</svg>