<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <rect width="600" height="375" fill="#EEF5F0"/>
  <!-- Уютный дом: Клининг и диван -->
  <g transform="translate(140, 60)">
    <!-- Диван -->
    <rect x="50" y="100" width="220" height="90" rx="14" fill="#4A7C59"/>
    <!-- Спинка дивана -->
    <rect x="40" y="40" width="240" height="70" rx="16" fill="#3D6A4B"/>
    <!-- Подлокотники -->
    <rect x="25" y="70" width="35" height="120" rx="14" fill="#282420"/>
    <rect x="260" y="70" width="35" height="120" rx="14" fill="#282420"/>
    <!-- Ножки -->
    <line x1="50" y1="190" x2="45" y2="230" stroke="#C2703E" stroke-width="8" stroke-linecap="round"/>
    <line x1="270" y1="190" x2="275" y2="230" stroke="#C2703E" stroke-width="8" stroke-linecap="round"/>
    <!-- Искры чистоты -->
    <path d="M 230 30 L 235 15 L 240 30 L 255 35 L 240 40 L 235 55 L 230 40 L 215 35 Z" fill="#C2703E"/>
  </g>
</svg>