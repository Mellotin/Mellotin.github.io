    <section class="section">
      <div class="container">
        <div class="booking-header">
          <span class="section-badge">Онлайн-бронь</span>
          <h1>Бронирование стола</h1>
        </div>

        <form class="booking-form" action="#" method="post">
          <div class="form-group">
            <label for="booking-name">Имя</label>
            <input type="text" id="booking-name" name="name" required placeholder="Ваше имя">
          </div>

          <div class="form-group">
            <label for="booking-phone">Телефон</label>
            <input type="tel" id="booking-phone" name="phone" required placeholder="+7 (999) 123-45-67">
          </div>

          <div class="form-group">
            <label for="booking-email">Email</label>
            <input type="email" id="booking-email" name="email" required placeholder="name@example.com">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="booking-date">Дата</label>
              <input type="date" id="booking-date" name="date" required>
            </div>
            <div class="form-group">
              <label for="booking-time">Время</label>
              <input type="time" id="booking-time" name="time" required>
            </div>
          </div>

          <div class="form-group">
            <label for="booking-guests">Количество гостей</label>
            <input type="number" id="booking-guests" name="guests" required min="1" max="20" value="2">
          </div>

          <div class="form-group">
            <label for="booking-wishes">Пожелания к бронированию</label>
            <textarea id="booking-wishes" name="wishes" rows="3" placeholder="Укажите аллергии или особые пожелания"></textarea>
          </div>

          <button type="submit" class="btn">Отправить заявку</button>
        </form>
      </div>
